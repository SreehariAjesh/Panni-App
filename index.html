<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM</title>
</head>

<body>
    <h1>Firebase Push Notification</h1>
    <p id="tokenDisplay">Fetching token...</p>
<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "YOUR-API-KEY",
        authDomain: "YOUR-AUTH-DOMAIN",
        projectId: "YOUR-PROJECT-ID",
        storageBucket: "YOUR-STORAGE-BUCKET",
        messagingSenderId: "YOUR-MESSAGING-SENDER-ID",
        appId: "YOUR-APP-ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);
    const db = getFirestore(app);

    // Register Service Worker
    navigator.serviceWorker.register("sw.js").then(registration => {
        getToken(messaging, {
            serviceWorkerRegistration: registration,
            vapidKey: 'YOUR-VAPID-KEY'
        }).then(async (currentToken) => {
            if (currentToken) {
                document.getElementById("tokenDisplay").innerText = "FCM Token: " + currentToken;
                console.log("Token:", currentToken);

                // Store Token in Firestore
                try {
                    await addDoc(collection(db, "fcm_tokens"), { token: currentToken });
                    window.alert("Token saved to Firestore");
                } catch (error) {
                    console.error("Error saving token: ", error);
                }
            } else {
                window.alert("No registration token available.");
            }
        }).catch((err) => {
            console.error("Error retrieving token: ", err);
        });
    });
</script>

</body>

</html>
