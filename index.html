<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM</title>
</head>

<body>
    <h1>Firebase Push Notification</h1>
    <p id="tokenDisplay">Fetching token...</p>
<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCV4ObQSMFZ2TgdLY1YqgarpmuUOQmvJGg",
      authDomain: "panni-2bdd6.firebaseapp.com",
      projectId: "panni-2bdd6",
      storageBucket: "panni-2bdd6.firebasestorage.app",
      messagingSenderId: "987197050153",
      appId: "1:987197050153:web:85744ce40318a3de40fb38",
      measurementId: "G-RXC45WCBNG"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);
    const db = getFirestore(app);

    // Register Service Worker
    navigator.serviceWorker.register("sw.js").then(registration => {
        getToken(messaging, {
            serviceWorkerRegistration: registration,
            vapidKey: 'BEvNfAHngb0nSlIPh3QDD7ScJ9YIM1u97FhdLAQmoWj6LHpVRNuYAgE1YOaia5M-mrpQ_PJkncGfsaWNwRTXng0'
        }).then(async (currentToken) => {
            if (currentToken) {
                document.getElementById("tokenDisplay").innerText = "FCM Token: " + currentToken;
                console.log("Token:", currentToken);

                // Store Token in Firestore
                try {
                    await addDoc(collection(db, "fcm_tokens"), { token: currentToken });
                    window.alert("Token saved to Firestore");
                } catch (error) {
                    console.error("Error saving token: ", error);
                }
            } else {
                window.alert("No registration token available.");
            }
        }).catch((err) => {
            console.error("Error retrieving token: ", err);
        });
    });
</script>

</body>

</html>
